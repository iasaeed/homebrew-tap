name: Test formula

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26.x
        run: |
          ls /Applications | grep Xcode || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
      - name: Tap
        run: brew tap iasaeed/tap "$GITHUB_WORKSPACE"
      - name: Install from source
        run: brew install --build-from-source iasaeed/tap/xcpurge
      - name: Test
        run: brew test iasaeed/tap/xcpurge
      - name: Version
        run: xcpurge --version
      - name: Audit
        run: brew audit --strict iasaeed/tap/xcpurge || true
